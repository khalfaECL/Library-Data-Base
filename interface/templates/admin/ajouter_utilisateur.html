{% extends "base.html" %}

{% block title %}Ajouter un utilisateur{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">➕ Ajouter un utilisateur</h2>

    <div class="card shadow">
        <div class="card-body">
            <form method="POST">
                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email <span class="text-danger">*</span>
                    </label>
                    <input type="email" class="form-control" name="email" required
                           placeholder="prenom.nom@ec-lyon.fr">
                    <small class="text-muted">Format : prenom.nom@ec-lyon.fr</small>
                </div>

                <!-- Prénom -->
                <div class="mb-3">
                    <label for="prenom" class="form-label">
                        Prénom <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" name="prenom" required
                           placeholder="Jean">
                </div>

                <!-- Nom -->
                <div class="mb-3">
                    <label for="nom" class="form-label">
                        Nom <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control" name="nom" required
                           placeholder="Dupont">
                </div>

                <!-- Rôle -->
                <div class="mb-3">
                    <label for="role" class="form-label">
                        Rôle <span class="text-danger">*</span>
                    </label>
                    <select class="form-select" name="role" required>
                        <option value="utilisateur">Utilisateur</option>
                        <option value="admin">Administrateur</option>
                    </select>
                </div>

                <!-- Laboratoires -->
                <div class="mb-4">
                    <label class="form-label">
                        Droits d'accès aux laboratoires <span class="text-danger">*</span>
                    </label>
                    <div class="alert alert-info">
                        <small>Sélectionnez les laboratoires auxquels cet utilisateur pourra accéder</small>
                    </div>
                    {% for labo in labos %}
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" 
                               name="labos" value="{{ labo.id_labo }}" 
                               id="labo{{ labo.id_labo }}">
                        <label class="form-check-label" for="labo{{ labo.id_labo }}">
                            {{ labo.nom_labo }}
                        </label>
                    </div>
                    {% endfor %}
                </div>

                <!-- Boutons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        ✅ Ajouter l'utilisateur
                    </button>
                    <a href="{{ url_for('admin.gerer_utilisateurs') }}" class="btn btn-secondary">
                        Annuler
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
